name: Stage 1 CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries for headless GUI test
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q main.py app core tests
      - name: Run unit and UI smoke tests
        run: python -m pytest -q
