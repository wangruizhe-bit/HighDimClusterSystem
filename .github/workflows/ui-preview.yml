name: Data Studio UI Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-preview.yml"
      - "app/**"
      - "tools/capture_screenshots.py"
      - "data/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: xcb
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime, Chinese fonts and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fonts-noto-cjk libegl1 libopengl0 libdbus-1-3 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
          python -m pip install -r requirements.txt
      - name: Generate genuine Data Studio screenshots under a virtual X display
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python -m tools.capture_screenshots
      - name: Upload Data Studio UI preview
        uses: actions/upload-artifact@v4
        with:
          name: HighDimClusterSystem-DataStudio-Preview
          path: screenshots/*.png
          retention-days: 30
          if-no-files-found: error
