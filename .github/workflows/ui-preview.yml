name: Data Studio UI Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-preview.yml"
      - "app/**"
      - "tools/capture_screenshots.py"
      - "data/sample_data.csv"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: xcb
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime, virtual display and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Capture actual redesigned Qt interface under Xvfb
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m tools.capture_screenshots
      - name: Upload Data Studio preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HighDimClusterSystem-DataStudio-Preview
          path: screenshots/*.png
          retention-days: 30
          if-no-files-found: error
