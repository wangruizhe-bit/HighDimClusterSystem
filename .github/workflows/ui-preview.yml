name: Data Studio UI Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ui-preview.yml"
      - "app/**"
      - "tools/capture_screenshots.py"
      - "data/sample_data.csv"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: minimal
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Capture 1080p 100% profile
        run: python -m tools.capture_screenshots --profile 1080_100
      - name: Capture 1080p 125% equivalent profile
        run: python -m tools.capture_screenshots --profile 1080_125
      - name: Capture default 1600x940 profile
        run: python -m tools.capture_screenshots --profile default
      - name: Capture minimum 1180x760 profile
        run: python -m tools.capture_screenshots --profile minimum
      - name: Upload Data Studio preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HighDimClusterSystem-DataStudio-Preview
          path: screenshots/**/*.png
          retention-days: 30
          if-no-files-found: error
