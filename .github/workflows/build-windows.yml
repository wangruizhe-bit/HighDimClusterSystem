name: Windows V1.0 Release Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows.yml"
      - "main.py"
      - "app/**"
      - "core/**"
      - "data/**"
      - "tools/**"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and packaging requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.11,<7"
      - name: Verify Python UI initialization
        run: python main.py --self-check
      - name: Capture genuine demonstration UI screenshots
        run: python -m tools.capture_screenshots
      - name: Build standalone Windows desktop app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name HighDimClusterSystem --collect-all sklearn --add-data "data/sample_data.csv;data" main.py
          if ($LASTEXITCODE -ne 0) { throw "Windows executable build failed" }
      - name: Test packaged executable startup
        shell: pwsh
        run: |
          & ".\dist\HighDimClusterSystem\HighDimClusterSystem.exe" --self-check
          if ($LASTEXITCODE -ne 0) { throw "Packaged executable startup check failed" }
      - name: Upload runnable Windows program
        uses: actions/upload-artifact@v4
        with:
          name: HighDimClusterSystem-V1.0-Windows
          path: dist/HighDimClusterSystem/
          retention-days: 30
          if-no-files-found: error
      - name: Upload genuine UI screenshot archive
        uses: actions/upload-artifact@v4
        with:
          name: HighDimClusterSystem-V1.0-Screenshots
          path: screenshots/*.png
          retention-days: 30
          if-no-files-found: error
