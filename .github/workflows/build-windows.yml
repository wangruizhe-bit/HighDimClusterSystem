name: Windows V1.0 Release Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-windows.yml"
      - "main.py"
      - "app/**"
      - "core/**"
      - "data/**"
      - "tools/**"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and packaging requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.11,<7"
      - name: Verify Python UI initialization
        run: python main.py --self-check
      - name: Capture 1920x1080 interface at Windows 100%
        run: python -m tools.capture_screenshots --profile 1080_100
      - name: Capture 1920x1080 interface at Windows 125%
        run: python -m tools.capture_screenshots --profile 1080_125
      - name: Capture default 1600x940 interface
        run: python -m tools.capture_screenshots --profile default
      - name: Capture minimum 1180x760 interface
        run: python -m tools.capture_screenshots --profile minimum
      - name: Build standalone Windows desktop app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name HighDimClusterSystem --collect-all sklearn --add-data "data;data" main.py
          if ($LASTEXITCODE -ne 0) { throw "Windows executable build failed" }
          Copy-Item "data\demo_high_dimensional.csv" "dist\HighDimClusterSystem\demo_high_dimensional.csv" -Force
      - name: Test packaged executable startup
        shell: pwsh
        run: |
          python -c "import subprocess; subprocess.check_call([r'dist\HighDimClusterSystem\HighDimClusterSystem.exe', '--self-check'], timeout=120)"
      - name: Check bundled sklearn native libraries before upload
        run: python -m tools.verify_release --original dist/HighDimClusterSystem
      - name: Upload runnable Windows program including hidden DLL directories
        uses: actions/upload-artifact@v4
        with:
          name: HighDimClusterSystem-V1.0-Windows-Fixed
          path: dist/HighDimClusterSystem/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Download the actual published Windows attachment for verification
        uses: actions/download-artifact@v4
        with:
          name: HighDimClusterSystem-V1.0-Windows-Fixed
          path: artifact-check/
      - name: Compare downloaded artifact and start its EXE
        run: python -m tools.verify_release --original dist/HighDimClusterSystem --downloaded artifact-check
      - name: Upload UI visual-check screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HighDimClusterSystem-V1.0-UI-Polish-Screenshots
          path: screenshots/**/*.png
          retention-days: 30
          if-no-files-found: error
